<h1>Opis pseudoelemnentów. </h1> <br><br>
<ol> 
<li>pseudoelementem:first-line (opis + przykład z ramki, użyj formatowania tekstu tak 
jak w opisie teoretyczny): </li>
<h1>Pseudoelementem  :first-line, który obejmuje formatowaniem całą 
pierwszą linię.</h1></ol></textarea><textarea cols="20" rows="12">p 
    { 
color:navy; 
    font-size:12pt; 
    } 
 
p:first-line 
    { 
color:red; 
    font-size:20pt; 
font-weight:bold; 
}<//textarea> 
<li>pseudoelementy: :after oraz :before (opis + przykład z ramki, użyj formatowania 
tekstu tak jak w opisie teoretyczny): </li>
<h1>pseudoelementy: :after oraz :before. 
Poza :first-letter oraz :first-line w specyfikacji umieszczono jeszcze dwa inne 
pseudoelementy: :after oraz :before. Oba elementy służą do umieszczania tekstu przed i za 
formatowanym elementem strony. Poniżej zamieszczam odpowiedni przykład.</h1><textarea cols="20" rows="17">p:before 
    { 
content:"TO SĄ ĆWICZENIA"; 
font-size:15pt; 
font-style:italic;    
font-weight:bold; 
    } 
 
p:after 
    { 
content:"AUTOR Król Lew"; 
    font-size:15pt; 
font-style:italic; 
font-weight:bold; 
}
<//textarea> 
<li>pseudoelement:first-letter(opis + przykład z ramki, użyj formatowania tekstu tak jak 
w opisie teoretyczny): 
</li><h1>Pseudoelement :first-letter pozwala na formatowanie pierwszej litery w bloku 
tekstu.  
Przykładowy arkusz spowoduje powiększenie pierwszej litery do wielkości 100 punktów i 
nadanie jej koloru czerwonego.</h1></.textarea>textarea cols="20" rows="12">p 
    { 
color:navy; 
    font-size:30pt; 
    } 
 
p:first-letter 
    { 
color:red; 
font-size:100pt; 
    } <//textarea>
    <h1>Zastosowanie  pseudoelement :first-letter  z innymi znacznikami.  
Przykład z nagłówkiem stopnia pierwszego.</h1>
    </,textarea cols="20" rows="12">H1 
{ 
color:navy; 
font-size:30pt; 
} 
H1:first-letter 
{ 
color:red; 
font-size:100pt; 
} </,textarea>
