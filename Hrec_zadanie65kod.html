<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Hrechka Z65_html</title>
    <link rel="stylesheet" href="hrec_CSS_z65.css">

<body>

    <div id="pierwszy_hrechka">
        <p>Akapit 1 - Blok Pierwszy (Wywołanie p:first-child)</p>
        <p>
            Identyfikator bloku: div#pierwszy_hrechka<br>
            Szerokość bloku: 700 + (7 * 4) = 728pt<br>
            Centrowanie bloku w poziomie: TAK<br>
            Kolor tła: jasnozielony RGB(200, 245, 200)<br>
            Obramowanie: grubość 3px, linia ciągła, kolor czarny RGB(0, 0, 0)<br>
            Promień krzywizny narożników r1: 7 + 5 (Artem) = 12px
        </p>
    </div>

    <div id="drugi_hrechka">
        <p>Akapit 1 - Blok Drugi (Wywołanie p:first-child)</p>
        <p>
            Identyfikator bloku: div#drugi_hrechka<br>
            Szerokość bloku: 900 + (7 * 4) = 928pt<br>
            Centrowanie bloku w poziomie: TAK<br>
            Kolor tła: jasnoniebieski RGB(200, 230, 255)<br>
            Obramowanie: grubość 5px, linia ciągła, kolor granatowy RGB(0, 0, 128)<br>
            Promień krzywizny narożników r2: 7 + 7 (Hrechka) = 14px
        </p>
    </div>

    <div id="trzeci_hrechka">
        <p>Akapit 1 - Blok Trzeci (Wywołanie p:first-child)</p>
        <p>
            Identyfikator bloku: div#trzeci_hrechka<br>
            Szerokość bloku: 1100 + (7 * 4) = 1128pt<br>
            Centrowanie bloku w poziomie: NIE<br>
            Kolor tła: różowy RGB(255, 200, 220)<br>
            Obramowanie: grubość 7px, linia ciągła, kolor fioletowy RGB(128, 0, 128)<br>
            Promień krzywizny narożników r3: 7 + 11 (listopad) = 18px
        </p>
    </div>

</body>

<h1>css</h1>
<textarea cols="80" rows="29">

body {
    background-color: silver;
    margin: 20px;
    font-family: Arial, sans-serif;
}

p {
    font-size: 11pt;
}

p:first-child {
    font-size: 7mm;
    font-style: italic;
}

div#pierwszy_hrechka {
    width: 728pt;
    background-color: rgb(200, 245, 200);
    border: 3px solid rgb(0, 0, 0);

    margin-left: auto;
    margin-right: auto;
    margin-bottom: 20px;
    padding: 15px;

    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    border-bottom-right-radius: 12px;
    border-bottom-left-radius: 12px;
}

div#drugi_hrechka {
    width: 928pt;
    background-color: rgb(200, 230, 255);
    border: 5px solid rgb(0, 0, 128);
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 20px;
    padding: 15px;
 
    border-top-left-radius: 14px;
    border-top-right-radius: 14px;
    border-bottom-right-radius: 14px;
    border-bottom-left-radius: 14px;
}


div#trzeci_hrechka {
    width: 1128pt; 
    background-color: rgb(255, 200, 220); 
    border: 7px solid rgb(128, 0, 128); 
   
    margin-left: 0;
    margin-right: auto;
    margin-bottom: 20px;
    padding: 15px;
    
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    border-bottom-right-radius: 18px;
    border-bottom-left-radius: 18px;
}
